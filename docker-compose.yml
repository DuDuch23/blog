services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Tâche one-shot : migrations + seed (ne tourne qu'une fois)
  migrate:
    build: .
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/blog"
      POSTGRES_URL: "postgresql://postgres:postgres@postgres:5432/blog"
      SESSION_SECRET: "change-this-secret-in-production"
      JWT_SECRET: "change-this-jwt-secret-in-production"
      BETTER_AUTH_SECRET: "change-this-better-auth-secret"
      BETTER_AUTH_URL: "http://localhost:3000/"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/blog"
      POSTGRES_URL: "postgresql://postgres:postgres@postgres:5432/blog"
      SESSION_SECRET: "change-this-secret-in-production"
      JWT_SECRET: "change-this-jwt-secret-in-production"
      BETTER_AUTH_SECRET: "change-this-better-auth-secret"
      BETTER_AUTH_URL: "http://localhost:3000/"
      NODE_ENV: "production"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
